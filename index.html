#lockgate { position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center;

#lockgate .card { width: min(420px, 88vw); background: #fff; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,40,90,.15); overflow: hidden; }

#lockgate button { margin-top: 12px; width: 100%; font-size: 15px; font-weight: 700; color: #fff; background: #0057A9; border: 0; border-radius: 8px; padding: 11px; cursor: pointer; }
#lockgate button:disabled { opacity: .6; cursor: default; }
#lockgate .err { min-height: 20px; margin-top: 10px; color: #D53F59; font-size: 13.5px; }

  async function decrypt(pw) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(BLOB.s), iterations: BLOB.n, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BLOB.i) }, key, b64(BLOB.c));
    return new TextDecoder().decode(pt);
  }
  function start(html) {
    document.querySelector('.reveal .slides').innerHTML = html;
    var g = document.getElementById('lockgate'); if (g) g.remove();
    var s = document.createElement('script'); s.src = 'assets/deck.js'; document.body.appendChild(s);
  }
  async function tryPw(pw, silent) {
    try { var html = await decrypt(pw); try { sessionStorage.setItem(KEY, pw); } catch (e) {} start(html); return true; }
    catch (e) { if (!silent) document.getElementById('lockerr').textContent = 'Sai mật khẩu, vui lòng thử lại.'; return false; }
  }
  if (!window.crypto || !crypto.subtle) {
    document.getElementById('lockerr').textContent = 'Trình duyệt chưa hỗ trợ giải mã. Hãy mở bằng Chrome hoặc Edge bản mới.';
  }
  var saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) tryPw(saved, true);
  document.getElementById('lockform').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var btn = document.getElementById('lockbtn'); btn.disabled = true; btn.textContent = 'Đang mở...';
    var ok = await tryPw(document.getElementById('lockpw').value, false);
    if (!ok) { btn.disabled = false; btn.textContent = 'Mở bài trình bày'; document.getElementById('lockpw').select(); }
  });
})();
</script>
</body>
